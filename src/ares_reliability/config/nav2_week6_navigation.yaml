# Week 6-only Nav2 configuration. Keep this file identical to the production
# ares_localization nav2_params.yaml except for goal_checker.stateful=false
# and the Week 6 BT action-server discovery wait documented below.
# A stateless goal checker must satisfy XY and yaw simultaneously, preventing
# yaw alignment from drifting outside the frozen 0.30 m mission threshold
# after XY was satisfied once.
/**:
  ros__parameters:
    use_sim_time: true

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /ares/scan
    tf_broadcast: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/priestly/ares_ws/maps/ares_warehouse.yaml

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: true

    odom_topic: /odometry/filtered

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.30
      stateful: false

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      max_linear_vel: 0.35
      min_linear_vel: -0.15

      max_angular_vel: 0.8
      min_angular_vel: -0.8

      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.55
      lookahead_time: 1.0

      transform_tolerance: 0.3

      use_velocity_scaled_lookahead_dist: true

      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.8

      use_collision_detection: true

      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.0

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    transform_tolerance: 0.2
    wait_for_service_timeout: 5000

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    local_frame: odom
    transform_tolerance: 0.2
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 2.0
      publish_frequency: 1.0

      resolution: 0.05

      robot_radius: 0.30

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /ares/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          obstacle_max_range: 18.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.70
        cost_scaling_factor: 2.0

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: true

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_footprint

      rolling_window: true

      width: 8
      height: 8
      resolution: 0.05

      always_send_full_costmap: true

      robot_radius: 0.30

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /ares/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          obstacle_max_range: 18.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.70
        cost_scaling_factor: 2.0
